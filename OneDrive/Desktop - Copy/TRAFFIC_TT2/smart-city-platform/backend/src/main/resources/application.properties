
spring.application.name=smart-city-platform
server.port=${PORT:8080}

# PostgreSQL Database - Neon
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wandering-band-b3n88x92-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.throw-exception-if-no-handler-found=true

# JWT Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Other Settings
spring.messages.basename=messages
spring.output.ansi.enabled=always